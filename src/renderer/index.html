<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Nova Files</title>
  <link rel="stylesheet" href="styles/main.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            win: {
              base: "var(--win-base, #18191c)",
              surface: "var(--win-surface, #202020)",
              chrome: "var(--win-chrome, #1c1d21)",
              header: "var(--win-header, #202020)",
              sidebar: "var(--win-sidebar, #17181b)",
              card: "var(--win-card, #232323)",
              hover: "var(--win-hover, rgba(255, 255, 255, 0.07))",
              selected: "var(--win-selected, rgba(0, 120, 212, 0.24))",
              selectedBorder: "var(--win-selected-border, #0078d4)",
              border: "var(--win-border, #2e323b)",
              subtleBorder: "var(--win-subtle-border, #252830)",
              accent: "var(--win-accent, #0078d4)",
              accentHover: "var(--win-accent-hover, #1084d8)",
              text: "var(--win-text, #f5f5f7)",
              textSecondary: "var(--win-text-sec, #cbd0dc)",
              textMuted: "var(--win-text-muted, #9499ab)"
            }
          },
          fontFamily: {
            sans: ["'Segoe UI'", "Inter", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
            mono: ["'JetBrains Mono'", "Consolas", "monospace"]
          },
          fontSize: {
            "win-xs": ["12px", { lineHeight: "16px" }],
            "win-sm": ["13.5px", { lineHeight: "19px" }],
            "win-base": ["15px", { lineHeight: "22px" }]
          }
        }
      }
    }
  </script>
</head>
<body class="bg-win-base text-win-text font-sans text-win-sm select-none antialiased overflow-hidden h-screen flex flex-col">

  <!-- WINDOW TITLEBAR & SYSTEM TABS -->
  <header class="bg-win-chrome border-b border-win-border shrink-0 flex flex-col z-40">
    <!-- Row 1: System Title Bar & Native Windows Tabs -->
    <div class="h-[44px] flex items-center justify-between pl-3 pr-0 titlebar-draggable">
      <!-- Brand / App Logo -->
      <div class="flex items-center gap-2 pr-3 py-1 shrink-0 titlebar-no-drag">
        <svg class="w-4.5 h-4.5 text-win-accent" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect height="18" rx="2" width="18" x="3" y="3"></rect>
          <path d="M9 3v18M3 9h18"></path>
        </svg>
        <span class="text-[13px] font-semibold tracking-tight text-win-text">Nova Files</span>
      </div>

      <!-- Integrated Desktop Tabs -->
      <div class="flex-1 flex items-end h-full gap-1 overflow-x-auto pt-1.5 pb-0" id="tabs-bar">
        <!-- Injected dynamically via tabs.js -->
        <button class="w-6 h-6 mb-1 rounded hover:bg-white/10 text-win-textMuted hover:text-win-text flex items-center justify-center transition-colors titlebar-no-drag shrink-0 cursor-pointer" id="btn-new-tab" title="New Tab (Ctrl+T)">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>

      <!-- Window System Controls (Minimize, Maximize, Close) -->
      <div class="flex items-center shrink-0 h-full titlebar-no-drag">
        <button class="w-11 h-full flex items-center justify-center text-win-textMuted hover:bg-white/10 hover:text-win-text transition-colors cursor-pointer" id="btn-win-min" title="Minimize">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M5 12h14"></path></svg>
        </button>
        <button class="w-11 h-full flex items-center justify-center text-win-textMuted hover:bg-white/10 hover:text-win-text transition-colors cursor-pointer" id="btn-win-max" title="Maximize">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect height="16" rx="1" width="16" x="4" y="4"></rect></svg>
        </button>
        <button class="w-11 h-full flex items-center justify-center text-win-textMuted hover:bg-[#e81123] hover:text-white transition-colors cursor-pointer" id="btn-win-close" title="Close">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>
      </div>
    </div>

    <!-- Row 2: Desktop Explorer Command Bar & Navigation -->
    <div class="h-12 px-3 flex items-center justify-between gap-2.5 bg-win-header">
      <!-- Left Navigation buttons (Back, Forward, Up, New Folder - NO visible refresh option!) -->
      <div class="flex items-center gap-1 shrink-0">
        <button class="w-8 h-8 rounded hover:bg-white/10 text-win-textSecondary hover:text-win-text flex items-center justify-center transition-colors cursor-pointer" id="btn-back" title="Back (Alt+Left)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <button class="w-8 h-8 rounded text-win-textMuted/40 flex items-center justify-center cursor-not-allowed" id="btn-forward" disabled="" title="Forward (Alt+Right)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
        <button class="w-8 h-8 rounded hover:bg-white/10 text-win-textSecondary hover:text-win-text flex items-center justify-center transition-colors cursor-pointer" id="btn-up" title="Up (Alt+Up)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"></path></svg>
        </button>
        <button class="px-2.5 h-8 rounded hover:bg-white/10 text-win-textSecondary hover:text-win-text flex items-center gap-1.5 transition-colors ml-1 cursor-pointer" id="btn-new-folder" title="New Folder (Ctrl+Shift+N)">
          <svg class="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 24 24"><path d="M19.5 21a3 3 0 0 0 3-3v-4.5a3 3 0 0 0-3-3h-1.5V9a3 3 0 0 0-3-3h-3.379a3 3 0 0 1-2.121-.879L8.379 4A3 3 0 0 0 6.257 3H4.5A3 3 0 0 0 1.5 6v12a3 3 0 0 0 3 3h15Z"></path></svg>
          <span class="text-win-xs font-semibold">New</span>
        </button>
      </div>

      <!-- Authentic Windows Breadcrumb Address Bar -->
      <div class="flex-1 flex items-center h-8 px-2.5 rounded bg-win-base border border-win-border text-win-sm text-win-textSecondary hover:border-win-accent/50 transition-all max-w-2xl cursor-text" id="breadcrumb-container">
        <svg class="w-4 h-4 text-win-accent mr-2 shrink-0 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect height="16" rx="2" width="20" x="2" y="4"></rect><path d="M6 16h.01M10 16h.01M14 16h.01M18 16h.01"></path>
        </svg>

        <div class="flex items-center gap-1 overflow-x-auto whitespace-nowrap min-w-0 flex-1 text-[13px]" id="breadcrumb-list">
          <!-- Injected dynamically -->
        </div>

        <div class="flex-1 hidden" id="address-input-container">
          <input class="w-full bg-transparent text-[13.5px] text-win-text focus:outline-none font-sans" id="address-input" type="text">
        </div>

        <div class="ml-auto flex items-center pl-1.5">
          <button class="text-win-textMuted hover:text-win-text p-1 rounded hover:bg-white/10 cursor-pointer" id="copy-address-btn" title="Copy Address (Ctrl+L)">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect height="14" rx="2" width="14" x="8" y="8"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
          </button>
        </div>
      </div>

      <!-- Quick Search — text only, zero visual chrome -->
      <input class="w-60 h-8 bg-transparent text-[13px] text-win-text placeholder:text-win-textMuted/40 shrink-0" id="desktop-search" placeholder="Search..." type="text">

      <!-- Settings Flyout Trigger Button & Inspector Toggle -->
      <div class="flex items-center gap-1.5 shrink-0 border-l border-win-border pl-2.5">
        <button class="relative w-8 h-8 rounded hover:bg-white/10 text-win-textSecondary hover:text-win-text flex items-center justify-center transition-colors cursor-pointer" id="btn-toggle-settings" title="Settings & Themes">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <!-- Toggle Properties Inspector Pane -->
        <button class="w-8 h-8 rounded hover:bg-white/10 text-win-textSecondary hover:text-win-text flex items-center justify-center transition-colors cursor-pointer" id="toggle-inspector-btn" title="Toggle Details Pane (Alt+P)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect height="18" rx="2" width="18" x="3" y="3"></rect><path d="M15 3v18"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- SETTINGS & THEME SELECTOR FLYOUT MODAL -->
  <div class="absolute top-24 right-4 z-50 w-76 rounded-md bg-win-chrome border border-win-border shadow-2xl p-3.5 text-win-xs flex flex-col gap-3 backdrop-blur-md hidden" id="settings-flyout">
    <div class="flex items-center justify-between pb-2 border-b border-win-border">
      <div class="flex items-center gap-1.5 font-semibold text-win-text text-[13px]">
        <svg class="w-4 h-4 text-win-accent" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>Application Preferences</span>
      </div>
      <button class="text-win-textMuted hover:text-win-text cursor-pointer p-1" id="btn-close-settings">✕</button>
    </div>

    <!-- Theme selector -->
    <div>
      <label class="block text-win-textMuted text-[10.5px] uppercase font-mono mb-1.5 tracking-wider font-semibold">Color Scheme</label>
      <div class="grid grid-cols-2 gap-1.5" id="theme-options">
        <button class="theme-opt active flex items-center gap-2 p-2 rounded border border-win-accent bg-win-selected text-win-text text-left cursor-pointer" data-theme="dark">
          <span class="w-3.5 h-3.5 rounded-full bg-[#18191c] border border-white/20"></span>
          <span class="font-medium">Dark</span>
        </button>
        <button class="theme-opt flex items-center gap-2 p-2 rounded border border-win-border hover:bg-white/5 text-win-textSecondary text-left cursor-pointer" data-theme="midnight">
          <span class="w-3.5 h-3.5 rounded-full bg-[#0a0c10] border border-white/20"></span>
          <span class="font-medium">Midnight</span>
        </button>
        <button class="theme-opt flex items-center gap-2 p-2 rounded border border-win-border hover:bg-white/5 text-win-textSecondary text-left cursor-pointer" data-theme="slate">
          <span class="w-3.5 h-3.5 rounded-full bg-[#1c212b] border border-white/20"></span>
          <span class="font-medium">Slate Gray</span>
        </button>
        <button class="theme-opt flex items-center gap-2 p-2 rounded border border-win-border hover:bg-white/5 text-win-textSecondary text-left cursor-pointer" data-theme="light">
          <span class="w-3.5 h-3.5 rounded-full bg-[#f8f9fa] border border-black/20"></span>
          <span class="font-medium">Light Theme</span>
        </button>
      </div>
    </div>

    <!-- Accent Color -->
    <div>
      <label class="block text-win-textMuted text-[10.5px] uppercase font-mono mb-1.5 tracking-wider font-semibold">Windows Accent</label>
      <div class="flex items-center gap-2.5" id="accent-options">
        <button class="w-7 h-7 rounded-full bg-[#0078d4] ring-2 ring-white/60 flex items-center justify-center text-white text-[11px] cursor-pointer" data-accent="#0078d4">✓</button>
        <button class="w-7 h-7 rounded-full bg-[#3b82f6] hover:scale-105 transition-transform cursor-pointer" data-accent="#3b82f6"></button>
        <button class="w-7 h-7 rounded-full bg-[#8b5cf6] hover:scale-105 transition-transform cursor-pointer" data-accent="#8b5cf6"></button>
        <button class="w-7 h-7 rounded-full bg-[#10b981] hover:scale-105 transition-transform cursor-pointer" data-accent="#10b981"></button>
        <button class="w-7 h-7 rounded-full bg-[#ec4899] hover:scale-105 transition-transform cursor-pointer" data-accent="#ec4899"></button>
      </div>
    </div>

    <!-- Options -->
    <div class="pt-2.5 border-t border-win-border flex flex-col gap-1.5 text-[12px] text-win-textSecondary">
      <label class="flex items-center gap-2 cursor-pointer">
        <input checked="" class="rounded border-win-border bg-win-base text-win-accent focus:ring-0 w-4 h-4" id="chk-extensions" type="checkbox">
        <span>Show file extensions</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer">
        <input class="rounded border-win-border bg-win-base text-win-accent focus:ring-0 w-4 h-4" id="chk-hidden" type="checkbox">
        <span>Show hidden system items</span>
      </label>
    </div>
  </div>

  <!-- WORKSPACE CONTAINER: SIDEBAR + FILE WORKSPACE + INSPECTOR -->
  <div class="flex flex-1 overflow-hidden relative">

    <!-- AUTHENTIC COMPACT WINDOWS SIDEBAR -->
    <aside class="bg-win-sidebar border-r border-win-border flex flex-col shrink-0 overflow-y-auto select-none py-2 text-win-sm" id="left-sidebar" style="width: 260px;">
      <!-- THIS PC -->
      <div class="px-3.5 py-1.5 flex items-center justify-between text-[11px] uppercase font-mono tracking-wider text-win-textMuted font-semibold">
        <span>This PC</span>
      </div>
      <nav class="flex flex-col px-2 gap-1" id="sidebar-this-pc">
        <!-- Injected dynamically -->
      </nav>

      <!-- QUICK ACCESS -->
      <div class="px-3.5 py-1.5 flex items-center justify-between text-[11px] uppercase font-mono tracking-wider text-win-textMuted font-semibold">
        <span>Quick Access</span>
      </div>
      <nav class="flex flex-col px-2 gap-1" id="sidebar-quick-access">
        <!-- Injected dynamically -->
      </nav>

      <!-- REAL DRIVES SECTION -->
      <div class="mt-3.5 px-3.5 py-1.5 flex items-center justify-between text-[11px] uppercase font-mono tracking-wider text-win-textMuted font-semibold">
        <span>Drives</span>
        <span class="text-[10px] text-win-textMuted/70 lowercase font-mono">auto-detected</span>
      </div>
      <div class="flex flex-col px-2 gap-1.5" id="sidebar-drives">
        <!-- Injected dynamically from real Windows drives -->
      </div>

      <!-- REAL LOCATIONS -->
      <div class="mt-3.5 px-3.5 py-1.5 flex items-center justify-between text-[11px] uppercase font-mono tracking-wider text-win-textMuted font-semibold">
        <span>Locations</span>
      </div>
      <nav class="flex flex-col px-2 gap-1" id="sidebar-locations">
        <!-- Injected dynamically: Desktop, Documents, Downloads, Pictures, Videos, Music -->
      </nav>
    </aside>

    <div class="resize-handle resize-handle-left" id="resize-sidebar"></div>

    <!-- CENTER DESKTOP FILE MANAGER CANVAS -->
    <main class="flex-1 flex flex-col bg-win-base min-w-0 overflow-hidden" id="main-explorer">
      <!-- Details View Header -->
      <div class="hidden border-b border-win-border bg-win-header text-win-xs text-win-textMuted font-semibold select-none shrink-0" id="details-header">
        <div class="details-grid">
          <div class="col-name flex items-center gap-1.5 cursor-pointer hover:text-win-text" id="sort-btn-name">
            <span>Name</span>
          </div>
          <div class="col-date flex items-center gap-1.5 cursor-pointer hover:text-win-text" id="sort-btn-date">
            <span>Date modified</span>
          </div>
          <div class="col-type flex items-center gap-1.5 cursor-pointer hover:text-win-text" id="sort-btn-type">
            <span>Type</span>
          </div>
          <div class="col-size text-right flex items-center justify-end gap-1.5 cursor-pointer hover:text-win-text" id="sort-btn-size">
            <span>Size</span>
          </div>
        </div>
      </div>

      <!-- Icons / Details Canvas -->
      <div class="flex-1 p-4 overflow-y-auto" id="file-container" tabindex="0">
        <div class="grid-icons-dynamic" id="desktop-grid">
          <!-- Real directory items rendered dynamically -->
        </div>
      </div>
    </main>

    <div class="resize-handle resize-handle-right" id="resize-inspector"></div>

    <!-- PROFESSIONAL DESKTOP PROPERTIES INSPECTOR (RIGHT UTILITY PANEL) -->
    <aside class="w-[320px] bg-win-sidebar border-l border-win-border flex flex-col shrink-0 overflow-y-auto select-none" id="inspector-pane" style="min-width:200px;max-width:450px;">
      <!-- Inspector Header -->
      <div class="h-10 px-3.5 border-b border-win-border flex items-center justify-between shrink-0 bg-win-header">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-win-accent" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="16" y2="12"></line><line x1="12" x2="12.01" y1="8" y2="8"></line></svg>
          <span class="text-win-sm font-semibold text-win-text">Properties</span>
        </div>
        <button class="w-6 h-6 rounded hover:bg-white/10 text-win-textMuted hover:text-win-text flex items-center justify-center transition-colors cursor-pointer" id="close-inspector-x" title="Close Details Pane">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="p-3.5 flex flex-col gap-3.5 overflow-y-auto text-win-sm">
        <!-- Preview container -->
        <div class="flex flex-col gap-1">
          <div class="relative w-full aspect-[16/10] rounded-md bg-black/40 border border-win-border overflow-hidden flex items-center justify-center" id="inspector-preview-box">
            <img alt="preview" class="w-full h-full object-contain hidden" id="inspector-preview-img" src="">
            <div class="w-full h-full flex flex-col items-center justify-center p-3 text-center" id="inspector-preview-generic">
              <svg class="w-12 h-12 text-win-accent mb-2 opacity-80" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect height="18" rx="2" width="18" x="3" y="3"></rect></svg>
              <span class="text-[12px] text-win-text font-medium min-w-0 overflow-wrap-anywhere break-all px-1" id="inspector-preview-generic-title">Folder</span>
            </div>
            <span class="absolute bottom-1.5 right-1.5 text-[10px] font-mono px-1.5 py-0.5 rounded bg-black/80 text-white border border-white/10 font-medium" id="inspector-badge-format">INFO</span>
          </div>
        </div>

        <!-- File Title & Quick Action Buttons -->
        <div class="flex flex-col gap-1.5 border-b border-win-border pb-3 min-w-0">
          <span class="font-semibold text-win-base text-win-text break-all min-w-0" id="inspector-filename">—</span>
          <span class="text-[12px] text-win-textMuted min-w-0 overflow-wrap-anywhere" id="inspector-filetype">—</span>
          
          <div class="grid grid-cols-3 gap-1.5 mt-2 min-w-0">
            <button class="px-2 py-1.5 rounded bg-win-accent hover:bg-win-accentHover text-white text-win-xs font-semibold flex items-center justify-center gap-1.5 shadow-xs transition-colors cursor-pointer min-w-0" id="inspector-btn-open" title="Open with default Windows app">
              <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" x2="21" y1="14" y2="3"></line></svg>
              <span class="truncate">Open</span>
            </button>
            <button class="px-2 py-1.5 rounded bg-white/5 hover:bg-white/10 text-win-text text-win-xs font-semibold flex items-center justify-center gap-1.5 border border-win-border transition-colors cursor-pointer min-w-0" id="inspector-btn-folder" title="Show in File Explorer">
              <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>
              <span class="truncate">Folder</span>
            </button>
            <button class="px-2 py-1.5 rounded bg-white/5 hover:bg-white/10 text-win-text text-win-xs font-semibold flex items-center justify-center gap-1.5 border border-win-border transition-colors cursor-pointer min-w-0" id="btn-copy-path" title="Copy full filepath">
              <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect height="14" rx="2" width="14" x="8" y="8"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
              <span class="truncate" id="copy-btn-text">Copy</span>
            </button>
          </div>
        </div>

        <!-- File Properties Table -->
        <div class="flex flex-col border border-win-border rounded bg-win-base/50 overflow-hidden min-w-0">
          <div class="px-2.5 py-1.5 bg-win-header border-b border-win-border text-[10.5px] font-mono uppercase text-win-textMuted font-semibold">
            <span>Information</span>
          </div>
          <table class="w-full text-left text-[12px] min-w-0">
            <tbody class="divide-y divide-win-border/50 font-mono">
              <tr>
                <td class="py-1.5 px-2.5 text-win-textMuted whitespace-nowrap w-[72px]">Size</td>
                <td class="py-1.5 px-2.5 text-win-text min-w-0 overflow-wrap-anywhere" id="prop-size">—</td>
              </tr>
              <tr>
                <td class="py-1.5 px-2.5 text-win-textMuted whitespace-nowrap">Dimensions</td>
                <td class="py-1.5 px-2.5 text-win-text min-w-0 overflow-wrap-anywhere" id="prop-dims">—</td>
              </tr>
              <tr>
                <td class="py-1.5 px-2.5 text-win-textMuted whitespace-nowrap">Format</td>
                <td class="py-1.5 px-2.5 text-win-text min-w-0 overflow-wrap-anywhere" id="prop-colorspace">—</td>
              </tr>
              <tr>
                <td class="py-1.5 px-2.5 text-win-textMuted whitespace-nowrap">Modified</td>
                <td class="py-1.5 px-2.5 text-win-text min-w-0 overflow-wrap-anywhere" id="prop-modified">—</td>
              </tr>
              <tr>
                <td class="py-1.5 px-2.5 text-win-textMuted whitespace-nowrap">Created</td>
                <td class="py-1.5 px-2.5 text-win-text min-w-0 overflow-wrap-anywhere" id="prop-created">—</td>
              </tr>
              <tr>
                <td class="py-1.5 px-2.5 text-win-textMuted whitespace-nowrap">Location</td>
                <td class="py-1.5 px-2.5 text-win-textMuted min-w-0 overflow-wrap-anywhere break-all" id="prop-path" title="">—</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </aside>
  </div>

  <!-- STATUS BAR: view controls (moved here from top) + zoom slider -->
  <footer class="h-8 bg-win-chrome border-t border-win-border z-40 flex items-center justify-between px-3 font-mono text-[12px] text-win-textMuted select-none shrink-0">
    <!-- LEFT: item count / selection / drive -->
    <div class="flex items-center gap-2.5 overflow-hidden">
      <span class="text-win-textSecondary font-medium" id="status-total-count">0 items</span>
      <span class="text-win-border">|</span>
      <span class="text-win-accent flex items-center gap-1.5" id="status-selection">0 items selected</span>
      <span class="text-win-border hidden sm:inline">|</span>
      <span class="text-win-textMuted hidden sm:inline" id="status-drive-info">Local Disk</span>
    </div>

    <!-- RIGHT: View Mode Buttons (moved from top toolbar) + Zoom Slider -->
    <div class="flex items-center gap-2 shrink-0">

      <!-- View mode buttons – the ONLY set in the entire app -->
      <div class="flex items-center bg-win-base/60 p-0.5 rounded border border-win-border" id="bottom-view-buttons">
        <button class="bottom-view-btn px-2 h-6 rounded flex items-center gap-1 text-[11.5px] font-medium cursor-pointer transition-colors" data-mode="icons" title="Icon Grid View" id="btn-view-icons">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect height="7" rx="1" width="7" x="3" y="3"></rect><rect height="7" rx="1" width="7" x="14" y="3"></rect><rect height="7" rx="1" width="7" x="14" y="14"></rect><rect height="7" rx="1" width="7" x="3" y="14"></rect></svg>
          <span>Icons</span>
        </button>
        <button class="bottom-view-btn px-2 h-6 rounded flex items-center gap-1 text-[11.5px] font-medium cursor-pointer transition-colors" data-mode="details" title="Details Table" id="btn-view-details">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18"></path></svg>
          <span>Details</span>
        </button>
      </div>

      <span class="text-win-border">|</span>

      <!-- Zoom / size slider (hidden by default, shown on hover) -->
      <div class="zoom-area flex items-center gap-2" id="zoom-control-area" title="Ctrl+Scroll to zoom, hover to show controls">
        <button class="w-6 h-6 rounded flex items-center justify-center text-win-textMuted hover:text-win-text hover:bg-white/10 transition-colors cursor-pointer" id="status-slider-dec" title="Smaller">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14"></path></svg>
        </button>
        <input class="win-slider w-32 cursor-pointer" id="status-icon-slider" max="100" min="0" step="1" type="range" value="48">
        <button class="w-6 h-6 rounded flex items-center justify-center text-win-textMuted hover:text-win-text hover:bg-white/10 transition-colors cursor-pointer" id="status-slider-inc" title="Larger">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
        <span class="text-[11px] font-mono text-win-accent bg-win-accent/15 px-2 py-0.5 rounded font-medium min-w-[110px] text-center" id="status-size-label">Medium (112px)</span>
      </div>
    </div>
  </footer>

  <!-- AUTHENTIC WINDOWS DESKTOP CONTEXT MENU (NO REFRESH OPTION) -->
  <div class="hidden absolute z-50 w-56 rounded-md bg-win-chrome border border-win-border shadow-xl py-1 text-win-xs text-win-text flex flex-col font-sans" id="desktop-context-menu">
    <!-- Rendered dynamically by contextMenu.js -->
  </div>

  <!-- FILE OPERATION MODAL (New Folder, Rename, Delete) -->
  <div class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay" id="operation-modal">
    <div class="w-88 rounded-lg bg-win-chrome border border-win-border shadow-2xl p-5 flex flex-col gap-3.5">
      <div class="font-semibold text-win-base text-win-text" id="modal-title">Operation</div>
      <div class="text-win-xs text-win-textSecondary" id="modal-desc"></div>
      <input class="w-full bg-win-base border border-win-border rounded px-3 py-2 text-win-sm text-win-text focus:outline-none focus:border-win-accent focus:ring-1 focus:ring-win-accent/30" id="modal-input" type="text">
      <div class="flex items-center justify-end gap-2.5 pt-1">
        <button class="px-3.5 py-1.5 rounded text-win-xs text-win-textSecondary hover:text-win-text hover:bg-white/5 border border-win-border transition-colors cursor-pointer" id="modal-cancel-btn">Cancel</button>
        <button class="px-4 py-1.5 rounded text-win-xs text-white bg-win-accent hover:bg-win-accentHover font-medium transition-colors cursor-pointer shadow-xs" id="modal-confirm-btn">OK</button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS (Separation of Concerns) -->
  <script src="js/navigation.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/fileIcons.js"></script>
  <script src="js/fileGrid.js"></script>
  <script src="js/inspector.js"></script>
  <script src="js/contextMenu.js"></script>
  <script src="js/fileOperations.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
